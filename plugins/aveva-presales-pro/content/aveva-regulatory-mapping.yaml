oil_gas:

  phmsa_gas_mega_rule:
    canonical_name: "PHMSA Gas Pipeline Safety Mega Rule"
    short_form: "Gas Mega Rule"
    plugin_legacy_term: "PHMSA 49 CFR 192"
    structure: "Three-phase rulemaking"
    phases:
      rin1:
        canonical_name: "Mega Rule Part 1 (RIN1)"
        scope: "Material verification, assessment expansion, recordkeeping for onshore gas transmission"
        effective_date: "2020-07-01"
      rin2:
        canonical_name: "Mega Rule Part 2 (RIN2)"
        scope: "Integrity management improvements, repair criteria, corrosion control, management of change"
        effective_date: "2023-05-24"
        compliance_milestone: "Initial compliance elements due 2024-02-26"
        federal_register: "87 FR 52224 (Aug 2022 publish)"
      rin3:
        canonical_name: "Mega Rule Part 3 (RIN3) — Onshore Gathering Lines"
        scope: "Expanded PHMSA jurisdiction over onshore gathering lines"
        effective_date: "2023-05-16"
    ldar_rule_2025_status:
      canonical_name: "PHMSA Gas Pipeline Leak Detection and Repair (LDAR) final rule"
      status: "WITHDRAWN — do NOT cite as an active compliance deadline."
      detail: "The Jan 2025 LDAR final rule (advanced leak detection, gathering-line corrosion control) was sent to but not published in the Federal Register, then pulled under the Jan 2025 regulatory-freeze EO. It is not in effect. The PIPES Act of 2020 Section 113 mandate still stands, so a future LDAR rulemaking is possible — but as of 2026-06-03 there is NO current LDAR compliance deadline. Any 2026-finalized LDAR/RIN-refile claim is UNVERIFIED; do not assert."
      confidence: "MEDIUM-HIGH"
      last_verified: "2026-06-03"
    presales_implication:
      sales_hook: "Mega Rule Parts 2 (effective May 2023) and 3 (effective May 2023) remain in effect and continue to drive SCADA-modernization and integrity-management conversations across midstream. Compliance reporting automation, integrity management workflows, and pipeline asset records are the AVEVA opportunity. NOTE: the separate 2025 LDAR final rule was withdrawn — frame leak-detection as operator-elected / integrity-driven, not a current federal deadline."
      seller_question: "How does your team handle Mega Rule Part 2 integrity management reporting? What's the data architecture between SCADA, integrity management, and the records system?"
    sources:
      - url: "https://www.federalregister.gov/documents/2022/08/24/2022-17031/pipeline-safety-safety-of-gas-transmission-pipelines-repair-criteria-integrity-management"
        type: "federal_register"
        last_verified: "2026-04-29"
      - url: "https://www.phmsa.dot.gov/news/phmsa-publishes-final-rule-strengthening-pipeline-safety-and-environmental-protection"
        type: "regulatory_primary"
        last_verified: "2026-04-29"

  phmsa_liquid:
    canonical_name: "PHMSA 49 CFR 195 — Hazardous Liquid Pipeline Safety"
    presales_implication: "Liquid pipeline integrity, leak detection, and custody-transfer reconciliation. AVEVA System Platform + PI System are widely deployed."
    sources:
      - url: "https://www.phmsa.dot.gov/regulations/title49/part/195"
        last_verified: "2026-04-29"

  oooo_b_c:
    canonical_name: "EPA NSPS Subpart OOOOb / OOOOc — Oil and Gas Methane Standards"
    short_form: "OOOOb / OOOOc"
    plugin_legacy_term: "OOOOa / OOOOb"   # previous text bundled them; OOOOb/c is the current pair
    final_rule_publication: "2024-03-08"
    overview:
      ooo_b: "New Source Performance Standards (NSPS) for new, reconstructed, and modified oil and gas sources"
      ooo_c: "Emission Guidelines (EG) — states develop plans for existing sources"
    status_2026: "MATERIALLY WEAKENED — posture shifted from federal mandate to operator-elected / state-driven. Update any framing that treats 2024 methane rules as firm in-force mandates."
    deadline_status_2026:
      - "Waste Emissions Charge (WEC, the methane fee under CAA 136) REPEALED via Congressional Review Act; EPA revoked 40 CFR Part 99 (FR notice 2025-05-19). The methane FEE no longer exists."
      - "EPA reconsideration final rule weakening OOOOb/OOOOc published 2026-04-09, EFFECTIVE 2026-06-08 — loosens flare/vent-gas (NHV) monitoring requirements and extends several compliance dates."
      - "Core OOOOb/OOOOc framework still exists but is materially softened; enforcement posture relaxed under the current administration."
      - "State plan timing under OOOOc remains in flux pending the reconsideration; treat prior state-plan deadlines as uncertain."
    presales_implication:
      sales_hook: "Methane/emissions monitoring is now better framed as OPERATOR-ELECTED and state-driven (e.g., investor/ESG pressure, voluntary OGMP 2.0, state programs) rather than a hard federal mandate — the 2024 rules were weakened in 2026 and the Waste Emissions Charge was repealed. AVEVA PI System + System Platform still aggregate continuous monitoring data into auditable records for operators who choose to (or are state-required to) monitor."
      seller_question: "Given the 2026 rollback of the federal methane rules and repeal of the Waste Emissions Charge, what's driving your emissions-monitoring strategy now — state requirements, investor/ESG commitments, or LDAR for product-loss recovery?"
      avoid_framing: "OOOOb/OOOOc and the Waste Emissions Charge are firm federal mandates"   # both were rolled back / repealed in 2025-2026
    sources:
      - url: "https://www.federalregister.gov/documents/2026/04/09/2026-06808/reconsideration-of-standards-of-performance-for-new-reconstructed-and-modified-sources-and-emissions"
        type: "federal_register"
        note: "2026 reconsideration final rule (eff. 2026-06-08)"
        last_verified: "2026-06-03"
      - url: "https://www.epa.gov/controlling-air-pollution-oil-and-natural-gas-operations/2026-final-rule-reduce-burden-oil-and"
        type: "regulatory_primary"
        last_verified: "2026-06-03"
      - url: "https://www.epa.gov/controlling-air-pollution-oil-and-natural-gas-operations/epas-final-rule-reduce-methane-and-other"
        type: "regulatory_primary"
        note: "Original 2024 methane rule (now reconsidered/weakened)"
        last_verified: "2026-06-03"

  api_recommended_practices:
    canonical_names:
      - "API 510 — Pressure Vessel Inspection Code"
      - "API 570 — Piping Inspection Code"
      - "API 653 — Tank Inspection, Repair, Alteration, and Reconstruction"
      - "API 1149 — Pipeline Variable Uncertainties"
    presales_implication: "AVEVA Asset Information Management (AIM) + PI Asset Framework inspection templates align with these RPs."

  bsee_boem_offshore:
